<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer Circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#0a192f" stroke-width="2"/>

  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#0a192f" stroke-width="1"/>

  <!-- Top Text Path -->
  <defs>
    <path id="topCurve" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
    <path id="bottomCurve" d="M 170,100 A 70,70 0 0,1 30,100" fill="none"/>
  </defs>

  <text font-family="Lato, sans-serif" font-size="10" font-weight="400" fill="#0a192f" letter-spacing="3">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      ESTUDIO JURÍDICO
    </textPath>
  </text>

  <text font-family="Lato, sans-serif" font-size="10" font-weight="400" fill="#0a192f" letter-spacing="3">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      ROBLEDO Y CÍA
    </textPath>
  </text>

  <!-- Central Monogram ER -->
  <text x="100" y="115" font-family="'Playfair Display', serif" font-size="65" font-weight="700" fill="#0a192f" text-anchor="middle">
    ER
  </text>
</svg>
